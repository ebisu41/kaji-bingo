<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f4">
<title>曜日別 家事ビンゴ</title>
<style>
:root{--bg:#f7f7f4;--card:#fff;--ink:#252923;--muted:#73786f;--line:#e4e6df;--accent:#dcebd9;--accent-strong:#6e9868;--today:#f0f4ed}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:560px;margin:0 auto;padding:24px 16px calc(36px + env(safe-area-inset-bottom))}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:20px}.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);margin:0 0 6px}h1{font-size:25px;letter-spacing:.01em;margin:0;font-weight:750}.date{color:var(--muted);font-size:13px;margin-top:8px}.weeknav{display:flex;gap:6px;align-items:center}.iconbtn{border:1px solid var(--line);background:white;border-radius:12px;width:38px;height:38px;font-size:18px;color:var(--ink)}
.summary{background:#eaf1e6;border-radius:18px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.summary small{color:#5e7059;font-size:12px}.summary strong{display:block;font-size:24px;margin-top:2px}.progress{width:94px;height:6px;background:#d4e1cf;border-radius:99px;overflow:hidden;margin-top:8px}.progress span{height:100%;width:0;background:var(--accent-strong);display:block;transition:width .2s}.bingo-pill{background:white;color:#456a40;border-radius:999px;padding:8px 11px;font-size:12px;font-weight:700}
.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px}.sectionhead h2{font-size:15px;margin:0}.hint{font-size:12px;color:var(--muted)}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.tile{position:relative;min-height:112px;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px 8px 10px;text-align:left;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;cursor:pointer;box-shadow:0 1px 1px #22200004;transition:background .15s,border .15s;overflow:hidden}.tile:active{transform:scale(.98)}.tile.done{background:var(--accent);border-color:#c5ddbf}.tile .day{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em}.tile .task{font-size:13px;font-weight:650;line-height:1.4;text-align:center;overflow-wrap:anywhere}.tile .check{width:21px;height:21px;border:1.5px solid #c9cec4;border-radius:50%;display:grid;place-items:center;color:white;font-size:12px}.tile.done .check{background:var(--accent-strong);border-color:var(--accent-strong)}.tile .edit{position:absolute;right:7px;top:6px;border:0;background:transparent;color:#8b9087;font-size:14px;padding:3px}.tile.free{background:#f2f3ee}.tile.free .task{font-size:16px;color:#7c8278}
.actions{display:flex;gap:8px;margin-top:14px}.btn{border:1px solid var(--line);background:white;color:var(--ink);border-radius:13px;padding:12px 14px;font:inherit;font-size:13px;font-weight:650;flex:1}.btn.primary{background:#29352a;color:white;border-color:#29352a}.btn:active{opacity:.8}.note{font-size:12px;color:var(--muted);line-height:1.6;margin:12px 2px 0}
.history{margin-top:22px;background:white;border:1px solid var(--line);border-radius:16px;padding:15px}.history h2{font-size:14px;margin:0 0 7px}.history p{font-size:12px;color:var(--muted);line-height:1.6;margin:0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#29352a;color:white;padding:12px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;z-index:5}.toast.show{opacity:1;transform:translate(-50%,0)}
dialog{border:0;border-radius:20px;padding:22px;width:calc(100% - 32px);max-width:420px;box-shadow:0 20px 70px #0003;color:var(--ink)}dialog::backdrop{background:#1e251e77}dialog h2{font-size:18px;margin:0 0 8px}dialog p{font-size:13px;color:var(--muted);line-height:1.6;margin:0 0 16px}label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}input{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px;font:inherit;font-size:16px;margin-bottom:14px} .modalactions{display:flex;gap:8px}.modalactions .btn{min-width:0}
@media(min-width:430px){.board{gap:11px}.tile{min-height:122px}.tile .task{font-size:14px}}
</style>
</head>
<body>
<main>
<header>
 <div><p class="eyebrow">MY WEEKLY ROUTINE</p><h1>曜日別 家事ビンゴ</h1><div class="date" id="weekLabel"></div></div>
 <div class="weeknav"><button class="iconbtn" id="prev" aria-label="前の週">‹</button><button class="iconbtn" id="next" aria-label="次の週">›</button></div>
</header>
<section class="summary" aria-live="polite">
 <div><small>今週の達成</small><strong><span id="count">0</span><span style="font-size:14px;font-weight:500;color:#5e7059"> / 9 マス</span></strong><div class="progress"><span id="bar"></span></div></div>
 <div class="bingo-pill" id="bingoStatus">まずは1マス！</div>
</section>
<div class="sectionhead"><h2>今週の家事</h2><span class="hint">マスをタップで達成</span></div>
<section class="board" id="board" aria-label="家事ビンゴ"></section>
<div class="actions"><button class="btn" id="reset">今週をリセット</button><button class="btn primary" id="editAll">家事リストを編集</button></div>
<p class="note">✓ 達成したマスはやさしい緑色に変わります。家事の名前はいつでも変更できます。</p>
<section class="history"><h2>使い方メモ</h2><p>家事カードをタップすると達成・未達成を切り替えられます。右上の鉛筆から1つずつ編集、下の「家事リストを編集」から9マスをまとめて変更できます。記録はこの端末のブラウザ内に保存されます。</p></section>
</main>
<div class="toast" id="toast" role="status"></div>
<dialog id="editDialog"><h2 id="dialogTitle">家事を編集</h2><p id="dialogDesc">家事の名前を入力してください。</p><label for="taskInput">家事の名前</label><input id="taskInput" maxlength="40" autocomplete="off"><div class="modalactions"><button class="btn" id="cancelEdit">キャンセル</button><button class="btn primary" id="saveEdit">保存する</button></div></dialog>
<dialog id="allDialog"><h2>家事リストを編集</h2><p>曜日ごとの家事を入力してください。空欄も保存できます。</p><div id="allInputs"></div><div class="modalactions"><button class="btn" id="cancelAll">キャンセル</button><button class="btn primary" id="saveAll">まとめて保存</button></div></dialog>
<script>
(()=>{
const days=['月','火','水','木','金','土','日','自由枠','自由枠'];
const defaults=['洗濯','キッチン掃除','床を掃除','お風呂掃除','トイレ掃除','シーツ交換','買い出し','気になる場所','予備の家事'];
const defaultState=()=>({tasks:[...defaults],done:Array(9).fill(false)});
const keyFor=d=>'chore-bingo-'+d;
const today=new Date(); today.setHours(0,0,0,0);
const mondayOf=d=>{let x=new Date(d);let offset=(x.getDay()+6)%7;x.setDate(x.getDate()-offset);return x};
let weekStart=mondayOf(today), editIndex=0, editMode='one';
const dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fmt=d=>`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
function load(){try{return JSON.parse(localStorage.getItem(keyFor(dateKey(weekStart))))||defaultState()}catch(e){return defaultState()}}
let state=load();
function save(){try{localStorage.setItem(keyFor(dateKey(weekStart)),JSON.stringify(state))}catch(e){}}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>t.classList.remove('show'),1900)}
function hasBingo(){const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];return lines.some(line=>line.every(i=>state.done[i]))}
function render(){
 const end=new Date(weekStart);end.setDate(end.getDate()+6);
 document.getElementById('weekLabel').textContent=`${fmt(weekStart)} 〜 ${fmt(end)}`;
 const board=document.getElementById('board');board.innerHTML='';
 state.tasks.forEach((task,i)=>{
  const button=document.createElement('button');button.className='tile'+(state.done[i]?' done':'')+(task===''?' free':'');button.setAttribute('aria-pressed',String(state.done[i]));
  const day=document.createElement('span');day.className='day';day.textContent=days[i];button.append(day);
  const taskEl=document.createElement('span');taskEl.className='task';taskEl.textContent=task||'＋ 家事を追加';button.append(taskEl);
  const check=document.createElement('span');check.className='check';check.textContent=state.done[i]?'✓':'';button.append(check);
  const edit=document.createElement('span');edit.className='edit';edit.textContent='✎';edit.setAttribute('aria-label','家事を編集');edit.addEventListener('click',e=>{e.stopPropagation();openOne(i)});button.append(edit);
  button.addEventListener('click',()=>{state.done[i]=!state.done[i];save();render();if(hasBingo())showToast('ビンゴ達成！おつかれさま 🎉');else if(state.done.every(Boolean))showToast('全マス達成！すばらしい！');});
  board.append(button);
 });
 const count=state.done.filter(Boolean).length;document.getElementById('count').textContent=count;document.getElementById('bar').style.width=(count/9*100)+'%';
 document.getElementById('bingoStatus').textContent=hasBingo()?'🎉 ビンゴ達成！':count===0?'まずは1マス！':`${count}マス達成中`;
}
const editDialog=document.getElementById('editDialog'), taskInput=document.getElementById('taskInput');
function openOne(i){editMode='one';editIndex=i;document.getElementById('dialogTitle').textContent=`${days[i]}曜日の家事`;document.getElementById('dialogDesc').textContent='家事の名前を入力してください。空欄にすると自由枠になります。';taskInput.value=state.tasks[i];editDialog.showModal();setTimeout(()=>taskInput.focus(),80)}
document.getElementById('cancelEdit').onclick=()=>editDialog.close();
document.getElementById('saveEdit').onclick=()=>{state.tasks[editIndex]=taskInput.value.trim();save();editDialog.close();render();showToast('家事を保存しました')};
const allDialog=document.getElementById('allDialog');
document.getElementById('editAll').onclick=()=>{const wrap=document.getElementById('allInputs');wrap.innerHTML='';state.tasks.forEach((task,i)=>{const label=document.createElement('label');label.textContent=`${days[i]}${i<7?'曜日':''}`;const input=document.createElement('input');input.value=task;input.maxLength=40;input.dataset.index=i;input.placeholder='家事の名前';wrap.append(label,input)});allDialog.showModal()};
document.getElementById('cancelAll').onclick=()=>allDialog.close();
document.getElementById('saveAll').onclick=()=>{document.querySelectorAll('#allInputs input').forEach(input=>state.tasks[Number(input.dataset.index)]=input.value.trim());save();allDialog.close();render();showToast('家事リストを保存しました')};
document.getElementById('reset').onclick=()=>{if(confirm('今週の達成状況をリセットしますか？ 家事の名前はそのまま残ります。')){state.done=Array(9).fill(false);save();render();showToast('達成状況をリセットしました')}};
document.getElementById('prev').onclick=()=>{weekStart.setDate(weekStart.getDate()-7);state=load();render()};
document.getElementById('next').onclick=()=>{weekStart.setDate(weekStart.getDate()+7);state=load();render()};
render();
})();
</script>
</body>
</html>
